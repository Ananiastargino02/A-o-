name: appname
description: "APPNAME - marketplace de cotacao reversa. Cliente pede, lojista cota, os dois fecham no chat."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.4

  # Geolocalizacao / geo-queries
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  geoflutterfire_plus: ^0.0.31

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  fluttertoast: ^8.2.8
  timeago: ^3.7.0

  # Utils
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
