<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MotorGuard</title>
<style>
  :root{
    --bg:#05070D; --card:#0c1320; --card2:#101a2b; --line:#16263A;
    --cyan:#00E5FF; --cyan2:#4DD0E1; --txt:#ECEFF1; --dim:#78909C;
    --ok:#4CAF50; --warn:#FFC107; --bad:#FF1744;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:16px;max-width:560px;margin:0 auto;
  }
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:22px;margin:0;letter-spacing:1px}
  h1 span{color:var(--cyan)}
  .pill{font-size:12px;padding:5px 10px;border-radius:20px;background:#3a1414;color:#ff8a80;border:1px solid #5a1414}
  .pill.on{background:#0e2a17;color:#9ff5b5;border-color:#1f5a30}
  button{
    font-family:inherit;font-size:15px;color:var(--txt);background:var(--card2);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;
  }
  button:active{filter:brightness(1.3)}
  button:disabled{opacity:.4}
  .primary{background:var(--cyan);color:#05202a;border:none;font-weight:700;width:100%;padding:15px;font-size:17px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card .lbl{font-size:12px;color:var(--dim);letter-spacing:1px}
  .card .val{font-size:26px;font-weight:700;margin-top:4px}
  .row{display:flex;gap:10px;margin:10px 0}
  .row button{flex:1}
  section{margin-top:18px}
  .stit{font-size:13px;color:var(--cyan2);letter-spacing:1px;margin:0 0 8px 4px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .item .top{display:flex;justify-content:space-between;align-items:center}
  .item .nome{font-size:16px;font-weight:600}
  .item .pct{font-size:14px;font-weight:700}
  .bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--cyan)}
  .item button{margin-top:8px;padding:7px 10px;font-size:13px}
  .cmd{display:flex;gap:8px}
  .cmd input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;font-size:15px;font-family:inherit}
  .log{background:#04060b;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#9fb3c8;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;margin-top:8px}
  .hint{font-size:12px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.5}
  .hide{display:none}
  summary{cursor:pointer;color:var(--dim);font-size:13px}
</style>
</head>
<body>

  <header>
    <h1>MOTOR<span>GUARD</span></h1>
    <span id="status" class="pill">desconectado</span>
  </header>

  <button id="btnConn" class="primary">Conectar</button>

  <div id="painel" class="hide">
    <div class="grid">
      <div class="card"><div class="lbl">QUILOMETRAGEM</div><div id="vKm" class="val">--</div></div>
      <div class="card"><div class="lbl">BATERIA</div><div id="vBat" class="val">--</div></div>
      <div class="card"><div class="lbl">PROTOCOLO</div><div id="vProto" class="val" style="font-size:20px">--</div></div>
      <div class="card"><div class="lbl">ESTADO</div><div id="vEstado" class="val" style="font-size:20px">--</div></div>
    </div>

    <div class="row">
      <button id="btnStatus">↻ Atualizar</button>
      <button id="btnManut">Manutenção</button>
    </div>

    <section id="secManut" class="hide">
      <p class="stit">MANUTENÇÃO</p>
      <div id="listaManut"></div>
    </section>

    <section>
      <p class="stit">COMANDO MANUAL</p>
      <div class="cmd">
        <input id="inpCmd" placeholder="ex.: STATUS" autocapitalize="characters" autocomplete="off" />
        <button id="btnSend">Enviar</button>
      </div>
      <details>
        <summary>Console / respostas</summary>
        <div id="log" class="log"></div>
      </details>
    </section>
  </div>

  <p class="hint">
    iPhone: abra no navegador <b>Bluefy</b>.<br>
    Android: abra no <b>Chrome</b>.<br>
    Ligue o Bluetooth e fique perto do MotorGuard.
  </p>

<script>
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // celular -> aparelho (write)
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // aparelho -> celular (notify)

let device, rxChar, txChar;
let rxAcc = '', rxTimer = null;

const $ = id => document.getElementById(id);
function log(t){ const l=$('log'); l.textContent += t+'\n'; l.scrollTop=l.scrollHeight; }
function setStatus(on, txt){ const s=$('status'); s.textContent=txt; s.classList.toggle('on',on); }

if(!navigator.bluetooth){
  $('btnConn').disabled = true;
  $('btnConn').textContent = 'Navegador sem Web Bluetooth';
}

$('btnConn').addEventListener('click', async () => {
  try{
    setStatus(false,'procurando…');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services:[NUS] }],
      optionalServices:[NUS]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    setStatus(false,'conectando…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    rxChar = await svc.getCharacteristic(RX);
    txChar = await svc.getCharacteristic(TX);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', onNotify);
    onConnect();
  }catch(e){
    setStatus(false,'desconectado');
    log('ERRO: '+e.message);
  }
});

function onConnect(){
  setStatus(true, device.name || 'conectado');
  $('btnConn').classList.add('hide');
  $('painel').classList.remove('hide');
  log('conectado.');
  send('STATUS');
}
function onDisconnect(){
  setStatus(false,'desconectado');
  $('btnConn').classList.remove('hide');
  $('painel').classList.add('hide');
  log('desconectado.');
}

async function send(cmd){
  if(!rxChar){ log('nao conectado'); return; }
  log('-> '+cmd);
  const data = new TextEncoder().encode(cmd);
  try{ await rxChar.writeValue(data); }
  catch(e){
    try{ await rxChar.writeValueWithoutResponse(data); }
    catch(e2){ log('ERRO envio: '+e2.message); }
  }
}

// junta as notificacoes (respostas longas podem vir em pedacos) e processa apos uma pausinha
function onNotify(e){
  const txt = new TextDecoder().decode(e.target.value);
  rxAcc += txt;
  clearTimeout(rxTimer);
  rxTimer = setTimeout(()=>{ const r=rxAcc; rxAcc=''; processar(r); }, 120);
}

function processar(resp){
  log('<- '+resp);
  if(/km=/.test(resp))      parseStatus(resp);
  if(/\d+:.*%/.test(resp))  parseManut(resp);
}

function parseStatus(s){
  const km  = (s.match(/km=(\d+)/)||[])[1];
  const bat = (s.match(/bat=([\d.]+V)/)||[])[1];
  const pr  = (s.match(/proto=(\S+)/)||[])[1];
  const es  = (s.match(/estado=(\S+)/)||[])[1];
  if(km)  $('vKm').textContent = Number(km).toLocaleString('pt-BR')+' km';
  if(bat) $('vBat').textContent = bat;
  if(pr)  $('vProto').textContent = pr;
  if(es)  $('vEstado').textContent = (es==='OPERANDO'?'LIGADO':es);
}

function parseManut(s){
  const sec=$('secManut'), box=$('listaManut');
  sec.classList.remove('hide'); box.innerHTML='';
  // cada linha: "0:Oleo Motor 12% int=10000km/180d"
  s.split('\n').forEach(linha=>{
    const m = linha.match(/^(\d+):(.+?)\s+(\d+)%/);
    if(!m) return;
    const idx=m[1], nome=m[2].trim(), pct=Math.min(100,+m[3]);
    const venc = pct>=100;
    const cor = venc?'var(--bad)':(pct>=80?'var(--warn)':'var(--cyan)');
    const div=document.createElement('div'); div.className='item';
    div.innerHTML =
      '<div class="top"><span class="nome">'+nome+'</span>'+
      '<span class="pct" style="color:'+cor+'">'+(venc?'VENCIDO':pct+'%')+'</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+cor+'"></i></div>'+
      '<button data-idx="'+idx+'">Resetar (zerar)</button>';
    div.querySelector('button').addEventListener('click',()=>{
      if(confirm('Zerar a manutencao de "'+nome+'"?')){
        send('MANUT RESET '+idx);
        setTimeout(()=>send('MANUT LIST'),400);
      }
    });
    box.appendChild(div);
  });
}

$('btnStatus').addEventListener('click', ()=>send('STATUS'));
$('btnManut').addEventListener('click', ()=>send('MANUT LIST'));
$('btnSend').addEventListener('click', ()=>{
  const v=$('inpCmd').value.trim(); if(v){ send(v); $('inpCmd').value=''; }
});
$('inpCmd').addEventListener('keydown', e=>{ if(e.key==='Enter') $('btnSend').click(); });
</script>
</body>
</html>
